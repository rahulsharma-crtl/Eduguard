<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EduGuard Privacy Canvas</title>
    <!-- Streamlit Component API -->
    <script src="https://cdn.jsdelivr.net/npm/streamlit-component-lib@1.3.0/dist/streamlit.js"></script>
    
    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
    
    <!-- TensorFlow.js & COCO-SSD for Object Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #0e1117; 
            color: #c9d1d9; 
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #input_video { display: none; }
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #30363d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            background-color: #000000;
        }
        #output_canvas {
            width: 100%;
            height: auto;
            display: block;
            background-color: #000000;
        }
        #status_bar {
            width: 100%;
            max-width: 640px;
            padding: 8px 12px;
            box-sizing: border-box;
            font-size: 13px;
            font-weight: 600;
            color: #58a6ff;
            background: rgba(22, 27, 34, 0.8);
            border-radius: 0 0 10px 10px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <div class="canvas-container">
        <!-- Hidden raw video element -->
        <video id="input_video" autoplay playsinline></video>
        <!-- Visible Privacy Wireframe Canvas (Black Background) -->
        <canvas id="output_canvas" width="640" height="480"></canvas>
    </div>
    <div id="status_bar">
        <span id="status_text">🛡️ Initializing Privacy Mesh System...</span>
        <span id="fps_text">30 FPS</span>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
